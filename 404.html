<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kinterest</title>
    <script>
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.host +
          '/uchiru-test-task/' +
          '?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(1)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
